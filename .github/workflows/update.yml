name: Atualizar notícias do Blogger

# Baixa as matérias novas do Blogger e grava em docs/ no próprio repositório.
# O GitHub Pages (Deploy from a branch: main /docs) publica sozinho depois do commit.
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar matérias do Blogger
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 tools/fetch_feed.py

      - name: Gravar no repositório se houver novidade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sem novidades."
          else
            git commit -m "Atualiza matérias do Blogger"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
